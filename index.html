<style>
:root{--bg:#ece9e1;--dot:#dbd7cb;--shell:#d6d0c0;--shell-dk:#b4ad98;--lcd:#fbf8ef;--ink:#3b2a2f;--title:#d9203f;--hint:#5f5a4d;--shadow:#ffb3c6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25241f;--dot:#302f29;--shell:#8f897a;--shell-dk:#6e6858;--hint:#cfc9b8;--title:#ff5c7a;--shadow:#6b2a40}
body.open:not([data-theme="light"]){--bg:#2a1620;--dot:#3a1f2c;--shell:#d9436d;--shell-dk:#a02a4d;--hint:#ffb3c6}}
:root[data-theme="dark"]{--bg:#25241f;--dot:#302f29;--shell:#8f897a;--shell-dk:#6e6858;--hint:#cfc9b8;--title:#ff5c7a;--shadow:#6b2a40}
body.open{--bg:#ffe3ea;--dot:#ffc4d3;--shell:#ff6f91;--shell-dk:#d9436d;--hint:#8a3a52}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100dvh;background:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2px);background-size:24px 24px;
font-family:"Press Start 2P",ui-monospace,Menlo,monospace;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px;overflow-x:hidden;transition:background-color 1s 1s}
h1{margin:0;text-align:center;font-weight:400;font-size:clamp(20px,7vw,64px);line-height:1.3;color:var(--title);text-shadow:.07em .07em 0 var(--shadow);min-height:1.3em;opacity:0;transform:scale(.4)}
.open h1{animation:pop .7s .5s cubic-bezier(.3,1.6,.5,1) forwards}
.device{--w:min(340px,86vw,calc((100vh - 250px)/1.25));--w:min(340px,86vw,calc((100dvh - 250px)/1.25));transition:background-color 1s 1s;width:var(--w);padding:calc(var(--w)*.19) calc(var(--w)*.13) calc(var(--w)*.11);background:var(--shell);border-radius:50% 50% 46% 46%/42% 42% 58% 58%;box-shadow:inset -8px -10px 0 var(--shell-dk),0 12px 0 rgba(0,0,0,.12)}
.lcd{position:relative;width:100%;aspect-ratio:1/1;background:#fbf8ef;background:var(--lcd);border:5px solid var(--ink);border-radius:10px;overflow:hidden}
#egg{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer}
#egg:disabled{cursor:default}
#egg:focus-visible{outline:4px solid var(--title);outline-offset:-8px}
svg{display:block;position:absolute;inset:0;width:100%;height:100%;shape-rendering:crispEdges}
svg *{transform-box:fill-box;transform-origin:50% 100%}
.btns{display:flex;justify-content:space-between;padding:0 12%;margin-top:9%}
.btns i{width:15%;aspect-ratio:1/1;border-radius:50%;background:#fbf8ef;background:var(--lcd);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.hint{margin:0;font-size:12px;color:var(--hint);text-align:center;animation:blink 1s steps(1) infinite}
.open .hint,.busy .hint{display:none}
.faces{display:flex;justify-content:space-between;width:100%;max-width:360px;padding:0 8px;pointer-events:none}
@media (max-width:759px){body{gap:16px;padding-top:16px;padding-bottom:16px}}
.face{width:clamp(56px,17vw,170px);aspect-ratio:3/4;object-fit:cover;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;border:5px solid var(--ink);box-shadow:6px 6px 0 var(--shell-dk);background:var(--lcd)}
.face.l{transform:rotate(-6deg)}
.face.r{transform:rotate(6deg)}
@media (min-width:760px){
.faces{display:block;max-width:none}
.face{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.face.l{left:24px}
.face.r{right:24px}}
.face.after{display:none;transform-origin:50% 90%}
.open .face.before{display:none}
.open .face.after{display:block;animation:rockL 1s ease-in-out infinite}
.open .face.r.after{animation-name:rockR;animation-delay:-.5s}
@keyframes rockL{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(4deg)}}
@keyframes rockR{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.open .face.after{animation:none}}
#shell{animation:hop 1s steps(1) infinite}
#shell.shake{animation:wob .3s ease-in-out 3}
#crack{opacity:0}
.cracked #crack{opacity:1}
.open #crack{opacity:0}
.open #top{animation:topOff .9s ease-in forwards}
.open #bot{animation:botOff .9s ease-in forwards}
#baby{opacity:0;transform:scale(.3)}
.open #baby{animation:pop .7s .35s cubic-bezier(.3,1.6,.5,1) forwards}
.open #hopper{animation:hop .7s 1.1s steps(1) infinite}
.bit{position:fixed;top:-20px;pointer-events:none;animation:fall linear forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes hop{50%{transform:translateY(-1px)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes topOff{to{transform:translate(-12px,-26px) rotate(-30deg);opacity:0}}
@keyframes botOff{to{transform:translateY(14px);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){#shell,.hint,#hopper{animation:none!important}.bit{display:none}}
</style>

          <g id="top" clip-path="url(#clipTop)"><use href="#eggart"/></g>

          <g id="crack"></g>

<script>
const K="#3b2a2f",S="#ffd9b8",RED="#e0202f",PK="#ff9db1",ON="#ffe1ea",W="#fff";
const r=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const shape=(rows,c,d)=>rows.map(([y,x,w])=>r(x+d,y,w-2*d,1,c)).join("");

// egg
const eggRows=[[3,12,8],[4,10,12],[5,9,14],[6,8,16],[7,7,18],[8,7,18],[9,6,20],[10,6,20],[11,5,22],[12,5,22],[13,5,22],
[14,4,24],[15,4,24],[16,4,24],[17,4,24],[18,4,24],[19,4,24],[20,4,24],[21,5,22],[22,5,22],[23,6,20],[24,7,18],[25,8,16],[26,10,12],[27,12,8]];
const inner=eggRows.slice(1,-1);
document.getElementById("eggart").innerHTML=
  shape(eggRows,K,0)+shape(inner,"#f6f0dc",1)+
  [[10,10,2,2],[19,8,2,2],[14,14,3,2],[8,19,2,2],[20,19,3,2],[13,22,2,2],[22,13,2,1]].map(([x,y,w,h],i)=>r(x,y,w,h,["#b7c4a3","#e3c887"][i%2])).join("")+
  r(9,7,2,2,W)+r(8,9,1,2,W);

// crack
const pts=[[4,16],[8,14],[12,18],[16,14],[20,18],[24,14],[28,16]];
let cr="";
for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c,d]=pts[i+1];
  for(let t=0;t<=4;t++)cr+=r(Math.round(a+(c-a)*t/4),Math.round(b+(d-b)*t/4),1,1,K);}
document.getElementById("crack").innerHTML=cr;

// baby
const headRows=[[7,11,10],[8,9,14],[9,8,16],[10,7,18],[11,7,18],[12,7,18],[13,7,18],[14,7,18],[15,7,18],[16,7,18],[17,7,18],[18,8,16],[19,9,14],[20,11,10]];
const skinRows=[[8,11,10],[9,9,14],[10,8,16],[11,8,16],[12,8,16],[13,8,16],[14,8,16],[15,8,16],[16,8,16],[17,8,16],[18,9,14],[19,10,12]];
document.getElementById("hopper").innerHTML=
  // body, arms, feet
  r(10,20,12,8,K)+r(11,21,10,6,ON)+
  r(7,22,4,4,K)+r(8,23,2,2,S)+r(21,22,4,4,K)+r(22,23,2,2,S)+
  r(10,28,5,2,K)+r(11,28,3,1,S)+r(17,28,5,2,K)+r(18,28,3,1,S)+
  // head
  headRows.map(([y,x,w])=>r(x,y,w,1,K)).join("")+
  skinRows.map(([y,x,w])=>r(x,y,w,1,S)).join("")+
  // face
  r(11,13,2,3,K)+r(19,13,2,3,K)+r(11,13,1,1,W)+r(19,13,1,1,W)+
  r(9,16,3,2,PK)+r(20,16,3,2,PK)+r(14,16,1,1,K)+r(17,16,1,1,K)+r(15,17,2,1,K)+
  // red bow
  r(9,3,6,5,K)+r(10,4,4,3,RED)+r(17,3,6,5,K)+r(18,4,4,3,RED)+r(14,4,4,4,K)+r(15,5,2,2,"#a3121e")+
  r(11,4,1,1,"#ff6b76")+r(19,4,1,1,"#ff6b76");

// chiptune audio (Web Audio, nessun file esterno)
let ac,master,bus,loopTimer,nextT=0,muted=false;
const VOL=.12,hz=n=>440*Math.pow(2,(n-69)/12);
function audio(){
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    ac=new C();master=ac.createGain();master.gain.value=VOL;master.connect(ac.destination);}
  if(ac.state==="suspended")ac.resume();
  return ac;
}
function note(n,t,d,type="square",v=1,out){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(hz(n),t);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d*.95);
  o.connect(g);g.connect(out||master);o.start(t);o.stop(t+d);
}
function noise(t,d){
  const len=Math.floor(ac.sampleRate*d),buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const src=ac.createBufferSource(),g=ac.createGain();g.gain.value=.6;
  src.buffer=buf;src.connect(g);g.connect(master);src.start(t);
}
function sfxShake(crackAt){
  const t=ac.currentTime;
  [0,.3,.6].forEach((o,i)=>note(84-i*5,t+o*crackAt,.08,"square",.7));
  noise(t+crackAt,.18);note(55,t+crackAt,.15,"triangle",1);
}
function fanfare(t){
  [72,76,79,84].forEach((n,i)=>note(n,t+i*.09,.12,"square",.8));
  note(88,t+.36,.5,"square",.8);note(48,t+.36,.5,"triangle",1);
}
// melodia originale, 16 note per giro x2
const E=60/140/2;
const MEL=[72,0,76,79,81,79,76,0,74,0,77,81,79,0,0,0, 72,0,76,79,84,81,79,76,77,76,74,71,72,0,0,0];
const BASS=[48,48,50,55,48,53,55,48];
function loop(){
  const t0=nextT;
  MEL.forEach((n,i)=>{if(n)note(n,t0+i*E,E*.9,"square",.55,bus);});
  BASS.forEach((n,i)=>{note(n,t0+i*4*E,E*3.5,"triangle",.9,bus);note(n+12,t0+i*4*E+2*E,E*.6,"triangle",.4,bus);});
  nextT+=MEL.length*E;
  loopTimer=setTimeout(loop,Math.max(0,(nextT-ac.currentTime-.4)*1000));
}
function startMusic(){
  if(!ac)return;
  bus=ac.createGain();bus.connect(master);
  const t=ac.currentTime+.05;fanfare(t);
  nextT=t+1.1;loop();
}
function stopMusic(){
  clearTimeout(loopTimer);
  if(bus){const b=bus;b.gain.setTargetAtTime(0,ac.currentTime,.03);setTimeout(()=>b.disconnect(),200);bus=null;}
}

// interaction
const egg=document.getElementById("egg"),shell=document.getElementById("shell"),root=document.body;
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){
  if(calm)return;
  const cols=["#e0202f","#ff6f91","#ffb3c6","#fff4d6","#ff9db1"];
  for(let i=0;i<40;i++){
    const b=document.createElement("span");b.className="bit";
    const s=6+Math.random()*8;
    b.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;background:${cols[i%5]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()*.6}s`;
    document.body.appendChild(b);setTimeout(()=>b.remove(),6500);
  }
}
let state="closed";
egg.addEventListener("click",()=>{
  if(state==="busy")return;
  if(state==="open"){
    stopMusic();state="closed";
    root.classList.remove("open","cracked","busy");
    egg.setAttribute("aria-label","Tocca l'uovo per scoprire una sorpresa");
    return;
  }
  state="busy";
  const crackAt=calm?.1:1,openAt=calm?.3:1.6;
  if(audio())sfxShake(crackAt);
  root.classList.add("busy");shell.classList.add("shake");
  setTimeout(()=>{shell.classList.remove("shake");root.classList.add("cracked")},crackAt*1000);
  setTimeout(()=>{root.classList.remove("busy");root.classList.add("open");document.getElementById("title").textContent=atob("SVQnUyBBIEdJUkwh");confetti();startMusic();state="open";egg.setAttribute("aria-label","Tocca la bebè per ricominciare")},openAt*1000);
});
</script>
